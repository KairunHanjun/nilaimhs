spring:
  application:
    name: nilaimhs
  profiles:
    default: demo
  jackson:
    deserialization:
      accept-float-as-int: false
  jpa:
    open-in-view: false
server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
