<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Pengolahan Nilai</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Konfigurasi warna kustom sesuai gambar */
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans">

    <div class="w-full max-w-md bg-white p-10 rounded-lg shadow-sm border border-gray-100">
        
        <div class="flex justify-center mb-6">
            <img th:src="@{/images/banner_new.jpg}" alt="App Logo" class="object-cover">
        </div>

        <h2 class="text-4xl text-center text-brand-dark font-light tracking-wide mb-10">LOGIN</h2>

        <div th:if="${param.error}" class="bg-red-100 text-red-600 p-3 rounded mb-4 text-sm text-center">
            Username atau password salah.
        </div>
        <div th:if="${param.logout}" class="bg-green-100 text-green-600 p-3 rounded mb-4 text-sm text-center">
            Anda telah berhasil logout.
        </div>

        <form th:action="@{/login}" method="post" class="space-y-6">
            
            <div class="relative flex items-center border border-gray-400 rounded-md overflow-hidden">
                <div class="px-4 py-3 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-dark" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="h-6 border-l border-gray-400"></div>
                <input type="text" id="username" name="username" placeholder="Username" 
                       class="w-full py-3 px-4 outline-none text-gray-700 focus:bg-gray-50" required>
            </div>

            <div class="relative flex items-center border border-gray-400 rounded-md overflow-hidden">
                <div class="px-4 py-3 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-dark" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
                        <circle cx="10" cy="13" r="1" fill="#fff"/>
                    </svg>
                </div>
                <div class="h-6 border-l border-gray-400"></div>
                <input type="password" id="password" name="password" placeholder="********" 
                       class="w-full py-3 px-4 outline-none text-gray-700 focus:bg-gray-50" required>
            </div>

            <button type="submit" 
                    class="w-full bg-gray-500 hover:bg-sky-500 text-white font-medium py-3 px-4 rounded transition duration-200">
                LOGIN
            </button>

        </form>

        <div class="mt-8 text-center text-gray-500 italic text-sm">
            Forgot Your Password? 
            <a href="#" class="text-gray-700 underline hover:text-black-500">Hubungi admin</a>
        </div>

    </div>

</body>
</html>
