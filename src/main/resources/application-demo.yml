# Disposable portfolio demo. Every restart restores synthetic sample data.
spring:
  datasource:
    url: jdbc:h2:mem:nilaimhs_demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: false
